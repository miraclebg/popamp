[package]
name = "popamp"
description = "A Winamp-style skinnable audio player for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["audio", "music-player", "winamp", "skins", "linux"]
categories = ["multimedia::audio"]

[dependencies]
popamp-core.workspace = true
popamp-audio.workspace = true
popamp-skin.workspace = true
popamp-plugins = { workspace = true, optional = true }
winit.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
image.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rustfft.workspace = true
fastrand.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry"] }

[features]
# Source plug-ins (WebAssembly, run by Extism). Off by default: without
# it Popamp is the player and its skins, and builds without wasmtime.
plugins = ["dep:popamp-plugins"]

[dev-dependencies]
zip.workspace = true
