name: Release

# A tag v<version> builds the Linux packages and the Windows installers
# and portable zips, publishes them as a GitHub release and puts the debs
# in the apt repository on GitHub Pages; a manual run only builds them
# (download from the run's page). Two of each: popamp, the player, and
# popamp-plus, built with plug-ins.
# The apt repository needs the secret APT_SIGNING_KEY (an armored gpg
# secret key without a passphrase), Pages built by GitHub Actions, and
# tags v* allowed to deploy to the github-pages environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: cargo test --release --locked --workspace
      - run: cargo test --release --locked --workspace --features popamp/plugins
      - name: Install appimagetool
        # Pinned releases with checksums: this job can write to the repository.
        run: |
          case "${{ matrix.arch }}" in
            x86_64)
              tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64)
              tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          printf '%s  %s\n' "$tool_sha" appimagetool.AppImage "$runtime_sha" appimage-runtime | sha256sum -c -
          # appimagetool is itself an AppImage; extract it on runners without FUSE.
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          echo "$RUNNER_TEMP/squashfs-root/usr/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Package popamp
        run: |
          cargo build --release --locked -p popamp
          sh packaging/build-deb.sh target/release/popamp dist
          sh packaging/build-appimage.sh target/release/popamp dist
      - name: Package popamp-plus
        run: |
          cargo build --release --locked -p popamp --features plugins
          sh packaging/build-deb.sh target/release/popamp dist
          sh packaging/build-appimage.sh target/release/popamp dist
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked --workspace
      - run: cargo test --release --locked --workspace --features popamp/plugins
      - name: Package popamp
        run: |
          cargo build --release --locked -p popamp
          sh packaging/build-windows.sh target/release/popamp.exe dist
      - name: Package popamp-plus
        run: |
          cargo build --release --locked -p popamp --features plugins
          sh packaging/build-windows.sh target/release/popamp.exe dist
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "Popamp $GITHUB_REF_NAME" --generate-notes

  apt:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: debs
          merge-multiple: true
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::the secret APT_SIGNING_KEY is not set" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          sh packaging/apt/build-apt-repo.sh debs site/apt "$BASE_URL/apt" "$key"
      # Each attempt names its own artifact: deploy-pages refuses a run
      # with two of the same name, which a re-run of this job would leave.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # Pages sometimes takes longer than the default 10 minutes.
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
