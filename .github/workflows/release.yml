name: Release

# A tag v<version> builds the Linux packages, the Windows installers and
# portable zips and the macOS disk images, publishes them as a GitHub
# release and asks
# popamp/apt to put the debs in https://apt.popamp.app; a manual run only
# builds them (download from the run's page). Two of each: popamp, the
# player, and popamp-plus, built with every function.
# Asking popamp/apt needs the secret APT_INDEX_TOKEN (see popamp/apt's
# README); without it, popamp/apt's daily run picks the release up.
# The macOS app is signed with a Developer ID and notarised when the
# secrets MACOS_CERTIFICATE (a base64 .p12), MACOS_CERTIFICATE_PASSWORD,
# NOTARY_KEY (a base64 App Store Connect .p8), NOTARY_KEY_ID and
# NOTARY_ISSUER are set; without them it is signed ad hoc.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      # The tests play Opus and tracker modules through these system libraries.
      - run: sudo apt-get update && sudo apt-get install -y libopus0 libopenmpt0
      - run: cargo test --release --locked --workspace
      - run: cargo test --release --locked --workspace --features popamp/plus
      - name: Install appimagetool
        # Pinned releases with checksums: this job can write to the repository.
        run: |
          case "${{ matrix.arch }}" in
            x86_64)
              tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64)
              tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          printf '%s  %s\n' "$tool_sha" appimagetool.AppImage "$runtime_sha" appimage-runtime | sha256sum -c -
          # appimagetool is itself an AppImage; extract it on runners without FUSE.
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          echo "$RUNNER_TEMP/squashfs-root/usr/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Package popamp
        run: |
          cargo build --release --locked -p popamp
          sh packaging/build-deb.sh target/release/popamp dist
          sh packaging/build-appimage.sh target/release/popamp dist
      - name: Package popamp-plus
        run: |
          cargo build --release --locked -p popamp --features plus
          sh packaging/build-deb.sh target/release/popamp dist
          sh packaging/build-appimage.sh target/release/popamp dist
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The Opus and libopenmpt DLLs and the MIDI SoundFont, beside popamp.exe.
      - run: |
          sh packaging/windows/fetch-libs.sh dist/libs
          cygpath -w "$PWD/dist/libs" >> "$GITHUB_PATH"
      - run: cargo test --release --locked --workspace
      - run: cargo test --release --locked --workspace --features popamp/plus
      - name: Package popamp
        run: |
          cargo build --release --locked -p popamp
          sh packaging/build-windows.sh target/release/popamp.exe dist
      - name: Package popamp-plus
        run: |
          cargo build --release --locked -p popamp --features plus
          sh packaging/build-windows.sh target/release/popamp.exe dist
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    # The signing keys are on this runner for a while: no write access.
    permissions:
      contents: read
    env:
      # Every binary in Popamp.app starts on macOS 12 and newer.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      # The tests load these from Homebrew; the app carries its own, built
      # for macOS 12 by fetch-libs.sh.
      - run: brew install opus libopenmpt
      - run: cargo test --release --locked --workspace
      - run: cargo test --release --locked --workspace --features popamp/plus
      - run: sh packaging/macos/fetch-libs.sh dist/libs
      # Both editions are built before any signing key is on the runner, so
      # no crate's build script or macro runs with one.
      - name: Build both editions
        run: |
          cargo build --release --locked -p popamp
          cp target/release/popamp target/popamp-player
          cargo build --release --locked -p popamp --features plus
          cp target/release/popamp target/popamp-plus
      - name: Signing keys, when the repository has them
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::notice::no MACOS_CERTIFICATE secret: the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "NOTARY_ISSUER=$NOTARY_ISSUER"
            } >> "$GITHUB_ENV"
          fi
      - name: Package both editions
        run: |
          sh packaging/build-macos.sh target/popamp-player dist
          sh packaging/build-macos.sh target/popamp-plus dist
          ls -lh dist
      - name: Remove the signing keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.dmg

  # macOS is a community-maintained platform: a failing macOS job does not
  # hold the release back, which then ships without the disk images.
  release:
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "Popamp $GITHUB_REF_NAME" --generate-notes
      - name: Rebuild the apt index
        env:
          GH_TOKEN: ${{ secrets.APT_INDEX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::APT_INDEX_TOKEN is not set; the daily Index run of popamp/apt will pick this release up"
            exit 0
          fi
          gh workflow run index.yml -R popamp/apt --ref main
