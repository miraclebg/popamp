name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The player with plug-ins (cargo build --features plugins).
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plugins -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plugins

  windows:
    name: Windows - clippy, test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Fixtures are compared byte for byte; keep their line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plugins -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plugins

  msrv:
    name: minimum Rust version (1.96)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
