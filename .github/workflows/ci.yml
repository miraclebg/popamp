name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Loaded at run time by the Opus and tracker module decoders.
      - run: sudo apt-get update && sudo apt-get install -y libopus0 libopenmpt0t64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The player with plug-ins (cargo build --features plugins).
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plugins -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plugins
      # And Popamp Plus, with the GPU visualizers (--features plus).
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plus -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plus

  windows:
    name: Windows - clippy, test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Fixtures are compared byte for byte; keep their line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Opus and libopenmpt DLLs the tests load, found on PATH.
      - shell: bash
        run: |
          libs="$(cygpath -u "$RUNNER_TEMP")/libs"
          sh packaging/windows/fetch-libs.sh "$libs"
          cygpath -w "$libs" >> "$GITHUB_PATH"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plugins -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plugins
      # And Popamp Plus, with the GPU visualizers (--features plus).
      - run: cargo clippy --workspace --all-targets --locked --features popamp/plus -- -D warnings
      - run: cargo test --workspace --locked --features popamp/plus

  msrv:
    name: minimum Rust version (1.96)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
