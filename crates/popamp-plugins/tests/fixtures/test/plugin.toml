id = "test"
name = "Test"
version = "0.1.0"
api = "1.0"
kind = "source"
description = "Answers the host's tests; see tests/test-plugin."

[source]
hosts = ["test.invalid"]
slow = true

[[permissions.exec]]
id = "rate"
program = "echo"
args = ["{rate}"]
[permissions.exec.vars]
rate = { type = "number" }

[[permissions.exec]]
id = "silence"
program = "head"
args = ["-c", "32", "/dev/zero"]

[[permissions.exec]]
id = "slow"
program = "sleep"
args = ["5"]

[[setting]]
key = "greeting"
label = "Greeting"
type = "text"
default = "hello"
